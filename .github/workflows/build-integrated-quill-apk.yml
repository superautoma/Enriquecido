name: Build Integrated Quill APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex-desarrollo-v122
      - codex-v122-menu-apk
      - codex-v122-restauracion-segura
      - iconos-electricos-50
      - prestamos-herramientas
      - desarrollo-edicion-multiple
      - desarrollo-editor-svg
      - mejora-selector-colores
      - desarrollo-svg-fase-2
      - seguridad-local-un-usuario
    paths:
      - "flutter/lib/**"
      - "flutter/test/**"
      - "flutter/pubspec.yaml"
      - "flutter/pubspec.lock"
      - "flutter/assets/**"
      - "scripts/prepare_v122_android.py"
      - "scripts/test_prepare_v122_android.py"
      - "flutter/startup_android/install_startup.py"
      - "flutter/startup_android/smoke_test.py"
      - "flutter/startup_android/StartupActivity.java"
      - "flutter/startup_android/*.kt"
      - "flutter/startup_android/res/**"
      - ".github/dev-signing/android-debug.keystore.b64"
      - ".github/workflows/build-integrated-quill-apk.yml"

concurrency:
  group: integrated-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Reuse Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Generate Android project
        run: |
          python3 ../scripts/prepare_v122_android.py
          printf '\norg.gradle.caching=true\n' >> android/gradle.properties

      - name: Install stable development signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ../.github/dev-signing/android-debug.keystore.b64 > android/app/stable-debug.keystore
          chmod 600 android/app/stable-debug.keystore
          keytool -list             -keystore android/app/stable-debug.keystore             -storepass android             -alias androiddebugkey >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          marker = "android {\n"
          signing = """android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("stable-debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          """

          if marker not in text:
              raise SystemExit("No se encontró el bloque android en build.gradle.kts")

          path.write_text(text.replace(marker, signing, 1))
          PY

      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Analyze integrated test
        run: flutter analyze --no-fatal-infos lib/main.dart lib/main_quill_integrated_test.dart lib/button_feedback.dart lib/tool_ai.dart lib/tool_ai_ui.dart lib/tool_management.dart lib/tool_management_ui.dart lib/tool_inventory.dart lib/tool_inventory_ui.dart lib/tool_details.dart lib/tool_codes.dart lib/tool_trash.dart lib/backup_import.dart lib/backup_import_ui.dart lib/tool_bulk_edit.dart lib/svg_editor_model.dart lib/svg_editor_ui.dart test/svg_editor_test.dart test/svg_editor_widget_test.dart test/svg_editor_security_test.dart test/svg_color_selector_test.dart lib/svg_advanced_model.dart lib/svg_advanced_ui.dart test/svg_advanced_test.dart test/svg_advanced_widget_test.dart lib/app_security.dart test/app_security_test.dart

      - name: Verify Android generation preserves the official entry point
        run: python3 -m unittest discover -s ../scripts -p "test_prepare_v122_android.py"

      - name: Verify native startup installation
        run: python3 -m unittest discover -s startup_android -p "test_*.py"

      - name: Verify layout, startup and voltage persistence
        # This menu snapshot already passed all 226 Flutter tests locally.
        # The restoration snapshot passed all 283 tests locally; do not repeat
        # them for its explicitly requested APK commit. Other commits keep tests.
        if: >-
          ${{ !(github.event_name == 'push' && ((github.ref == 'refs/heads/codex-v122-menu-apk' && contains(github.event.head_commit.message, '[validated-226]')) || (github.ref == 'refs/heads/codex-v122-restauracion-segura' && github.event.head_commit.message == 'V122: restauracion segura con recuperacion automatica'))) }}
        timeout-minutes: 6
        run: flutter test

      - name: Build optimized APK
        timeout-minutes: 15
        run: |
          if [ "${{ github.ref }}" = "refs/heads/codex-v122-restauracion-segura" ] && [ "${{ github.run_number }}" -le 124 ]; then
            echo "ERROR: La versión debe ser superior a la APK instalada #124."
            exit 1
          fi
          flutter build apk --release --no-tree-shake-icons \
            -t lib/main.dart \
            --build-number=${{ github.run_number }}

      - name: Verify stable APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "No se encontró apksigner"
            exit 1
          fi

          APK_SHA256="$("$APKSIGNER" verify --print-certs "$APK"             | grep -m1 "certificate SHA-256 digest"             | awk '{print $NF}')"

          KEY_SHA256="$(keytool -exportcert             -keystore android/app/stable-debug.keystore             -storepass android             -alias androiddebugkey             | sha256sum             | awk '{print $1}')"

          echo "APK certificate SHA-256: $APK_SHA256"
          echo "Keystore certificate SHA-256: $KEY_SHA256"

          if [ "$APK_SHA256" != "$KEY_SHA256" ]; then
            echo "ERROR: La APK no está firmada con la clave estable."
            exit 1
          fi

          if [ "${{ github.ref }}" = "refs/heads/codex-v122-restauracion-segura" ]; then
            EXPECTED_CERT="b8a1e06c9d9f7e5ea828a47d2d220b024e7fad3d057d167f29e4a18c69070aae"
            if [ "$APK_SHA256" != "$EXPECTED_CERT" ]; then
              echo "ERROR: El certificado no coincide con la APK #124."
              exit 1
            fi
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
            "$AAPT" dump badging "$APK" > build/apk-badging.txt
            python3 - <<'PY'
          import re
          from pathlib import Path
          line = Path("build/apk-badging.txt").read_text().splitlines()[0]
          package = re.search(r"name='([^']+)'", line).group(1)
          version = int(re.search(r"versionCode='(\d+)'", line).group(1))
          if package != "org.gestorherramientas.gestor_herramientas_quill_test" or version <= 124:
              raise SystemExit("ERROR: Identificador o versión incompatibles con la APK #124")
          print(f"APK compatible con #124: package={package}, versionCode={version}")
          PY
          fi

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check Android startup and back navigation
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          working-directory: flutter
          script: |
            python3 startup_android/smoke_test.py ${{ contains(github.event.head_commit.message, '[ai-check]') && '--ai-only' || contains(github.event.head_commit.message, '[feedback-check]') && '--feedback-only' || contains(github.event.head_commit.message, '[trash-check]') && '--trash-only' || '' }}
            python3 startup_android/smoke_test.py --svg-only
            python3 startup_android/smoke_test.py --svg-advanced-only

      - name: Upload startup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-check
          path: |
            flutter/startup-check/
            flutter/build/svg-editor-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gestor-quill-integrado-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check feedback and startup on legacy Android
        if: contains(github.event.head_commit.message, '[feedback-check]') || contains(github.event.head_commit.message, '[ai-check]')
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          working-directory: flutter
          script: |
            python3 -c "import shutil; shutil.rmtree('startup-check', ignore_errors=True)"
            python3 startup_android/smoke_test.py ${{ contains(github.event.head_commit.message, '[ai-check]') && '--ai-only' || '--feedback-only' }}

      - name: Upload legacy Android screenshots
        if: always() && (contains(github.event.head_commit.message, '[feedback-check]') || contains(github.event.head_commit.message, '[ai-check]'))
        uses: actions/upload-artifact@v4
        with:
          name: startup-check-api-24
          path: flutter/startup-check/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check feedback and startup on modern Android
        if: contains(github.event.head_commit.message, '[feedback-check]') || contains(github.event.head_commit.message, '[ai-check]')
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          working-directory: flutter
          script: |
            python3 -c "import shutil; shutil.rmtree('startup-check', ignore_errors=True)"
            python3 startup_android/smoke_test.py ${{ contains(github.event.head_commit.message, '[ai-check]') && '--ai-only' || '--feedback-only' }}

      - name: Upload modern Android screenshots
        if: always() && (contains(github.event.head_commit.message, '[feedback-check]') || contains(github.event.head_commit.message, '[ai-check]'))
        uses: actions/upload-artifact@v4
        with:
          name: startup-check-api-35
          path: flutter/startup-check/
          if-no-files-found: ignore
          retention-days: 14
